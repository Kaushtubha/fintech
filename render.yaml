services:
  - type: web
    name: finsight-analytics-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && python backend/scripts/generate_dataset.py && python backend/scripts/clean_data.py"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
